
      - name: Diagnose Gradle wrapper
        shell: bash
        run: |
          echo "=== DEFAULT_JVM_OPTS ==="
          grep -n 'DEFAULT_JVM_OPTS' gradlew || true

          echo "=== JAVA environment ==="
          echo "JAVA_HOME=$JAVA_HOME"
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:-<empty>}"
          echo "JDK_JAVA_OPTIONS=${JDK_JAVA_OPTIONS:-<empty>}"
          echo "_JAVA_OPTIONS=${_JAVA_OPTIONS:-<empty>}"
          java -version

          echo "=== Gradle wrapper ==="
          chmod +x gradlew
          ./gradlew --version --no-daemon --stacktrace
