
name: Build Heroes Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Heroes Arena
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify environment
        shell: bash
        run: |
          echo "=== Java ==="
          java -version

          echo "=== SDK ==="
          echo "$ANDROID_HOME"
          sdkmanager --list_installed

          echo "=== Project files ==="
          ls -la

          test -f gradlew || {
            echo "ERROR: gradlew not found"
            exit 1
          }

          test -f gradle/wrapper/gradle-wrapper.properties || {
            echo "ERROR: Gradle wrapper properties not found"
            exit 1
          }

      - name: Fix Gradle wrapper JVM options
        shell: bash
        run: |
          chmod +x gradlew

          echo "=== Original JVM options ==="
          grep -n -E 'DEFAULT_JVM_OPTS|JAVA_OPTS|JVM_OPTS' \
            gradlew || true

          echo "=== Wrapper distribution ==="
          cat gradle/wrapper/gradle-wrapper.properties

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("gradlew")
          s = p.read_text()

          # Normalize the standard Gradle wrapper default JVM options.
          pattern = r'(?m)^DEFAULT_JVM_OPTS=.*$'
          replacement = 'DEFAULT_JVM_OPTS=\'"-Xmx64m" "-Xms64m"\''
          updated, count = re.subn(pattern, replacement, s, count=1)

          if count == 1:
              p.write_text(updated)
              print("Normalized DEFAULT_JVM_OPTS in gradlew")
          else:
              print("DEFAULT_JVM_OPTS not found; no change made")
          PY

          echo "=== JVM options after normalization ==="
          grep -n -E 'DEFAULT_JVM_OPTS|JAVA_OPTS|JVM_OPTS' \
            gradlew || true

      - name: Diagnose Gradle properties
        shell: bash
        run: |
          echo "=== gradle.properties files ==="
          find . -name gradle.properties \
            -not -path "./.git/*" \
            -type f -print -exec cat {} \;

          echo "=== Java option environment ==="
          env | grep -E \
            '^(JAVA_TOOL_OPTIONS|JDK_JAVA_OPTIONS|JAVA_OPTS|GRADLE_OPTS)=' \
            || true

      - name: Verify Gradle wrapper
        run: ./gradlew --version --no-daemon

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace \
            --max-workers=2

      - name: Find generated APKs
        if: always()
        shell: bash
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" \
            -not -path "./.git/*" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Heroes-Arena-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
