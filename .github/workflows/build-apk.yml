
name: Build Heroes Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Android SDK Manager
        id: sdk
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "${{ steps.sdk.outputs.sdkmanager }}" \
            --sdk_root="$ANDROID_HOME" --licenses \
            || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          "${{ steps.sdk.outputs.sdkmanager }}" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Verify SDK installation
        run: |
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
          java -version

      - name: Check project structure
        shell: bash
        run: |
          echo "Repository files:"
          ls -la

          if [ ! -f gradlew ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle configuration:"
          find . -maxdepth 4 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \) \
            -not -path "./.git/*"

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find generated APKs
        if: always()
        run: |
          find . -type f -name "*.apk" \
            -not -path "./.git/*" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Heroes-Arena-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
